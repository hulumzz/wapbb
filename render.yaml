services:
  - type: web
    name: wapbb-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w @wapbb/api
    startCommand: npm run db:migrate:compiled -w @wapbb/api && npm run start -w @wapbb/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: INTERNAL_DISPATCH_SECRET
        generateValue: true
      - key: WA_SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: DEFAULT_BATCH_SIZE
        value: "10"
      - key: PROCESSING_TIMEOUT_MINUTES
        value: "15"
      - key: RETRY_DELAY_SECONDS
        value: "60"
      - key: DEFAULT_BANNER_URL
        value: https://i.ibb.co.com/fVFQc0HD/Chat-GPT-Image-16-Sep-2026-11-08-14-1-2.png
      - key: INTERACTIVE_CTA_ENABLED
        value: "false"
      - key: INTERACTIVE_CTA_LABEL
        value: Buka informasi
      - key: INTERACTIVE_CTA_FOOTER
        value: Informasi resmi desa

  - type: web
    name: wapbb-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @wapbb/web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
